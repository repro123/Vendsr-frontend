<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link href="/src/output.css" rel="stylesheet" />
  </head>

  <body
    class="min-h-dvh antialiased bg-bodyBackground text-paragraphColor font-inter"
    data-page="user-dashboard"
  >
    <header class="bg-white sticky top-0 z-50 px-4 py-3 hidden md:block">
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <a href="/" aria-label="Vendsr Home Page">
          <img src="/assets/icons/vendsr-logo.png" alt="Vendsr Logo" />
        </a>
      </div>
    </header>

    <nav>
      <ul>
        <li>
          <a href=""
            ><img src="/assets/icons/shop.png" alt="" /> <span>Shop</span></a
          >
        </li>
        <li>
          <a href=""
            ><img src="/assets/icons/saved.png" alt="" />
            <span>Wishlist</span></a
          >
        </li>
        <li>
          <a href=""
            ><img src="/assets/icons/notification.png" alt="" />
            <span>Notification</span></a
          >
        </li>
        <li>
          <a href=""
            ><img src="/assets/icons/profile-icon.png" alt="" />
            <span>Profile</span></a
          >
        </li>
      </ul>
    </nav>

    <main>
      <header>
        <div>
          <picture>
            <source
              srcset="/assets/images/dashboard-header-image-desktop.png"
              type="image/png"
              media="(min-width: 768px)"
            />
            <img
              src="/assets/images/dashboard-header-image-mobile.png"
              alt="Felicity Jewelry Banner"
            />
          </picture>

          <div>
            <img src="/assets/images/Felicity.png" alt="Felicity" />

            <div>
              <p>
                Felicity Jewelry
                <span><img src="/assets/icons/Verified.png" alt="" /></span>
              </p>
              <p>@feliciasmiles</p>
            </div>
          </div>
        </div>
      </header>

      <section>
        <div>
          <div>
            <ul>
              <li><button>Activity</button></li>
              <li><button>Products</button></li>
              <li>
                <button><span aria-hidden="true">+</span> Add Items</button>
              </li>
            </ul>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
