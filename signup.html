<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendsr Sign up Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/output.css" />
  </head>
  <body
    class="min-h-dvh antialiased bg-bodyBackground text-paragraphColor font-inter"
    data-page="Sign_up"
  >
    <header class="bg-white sticky top-0 z-50 px-4 py-3 hidden md:block">
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <a href="#" aria-label="Vendsr Sign Up Page">
          <img src="./assets/icons/vendsr-logo.png" alt="Vendsr Logo" />
        </a>

        </div>

        <dialog
          id="mobileNavDialog"
          aria-labelledby="mobileNavButton"
          class="max-h-dvh h-dvh w-full max-w-[18rem] ml-auto"
        >
          <div class="h-full relative pt-24 overflow-y-auto px-4">
            <button
              id="mobileNavCloseButton"
              aria-label="Close Mobile Nav"
              class="absolute top-8 right-8 text-2xl font-black text-primary focus:outline-primary focus:outline-2 rounded-full p-2 hover:bg-primary/10 cursor-pointer transition duration-300 h-12 w-12 grid place-items-center"
            >
              <span aria-hidden="true">X</span>
            </button>

          </div>
        </dialog>
      </div>
    </header>

    <main class="md:p-2  min-h-[calc(100dvh-64px)] md:flex justify-center items-center">
      <div class= "bg-white md:px-14 box-border px-4 md:py-5 device-width md:rounded-[calc(9px+1vw)]">
        <form id="form">
          <div class = "flex justify-between items-center w-full mb-2 md:mb-0">
            <a href="#"> 
              <img  src="./assets/icons/arrow-back.png" alt = "back-button"> 
            </a>

            <h2 class="font-bold text-center py-4 flex-1"> Create an account</h2>
          </div>
          <div>
            <div class="flex md:flex-row flex-col justify-between md:gap-24">
  
              <div class = "md:w-1/2 flex flex-col gap-3">
                <div class="flex flex-col">
                  <label class = "pb-1" for="full_name"> Full Name</label>
                  <input class=" rounded-md p-3 text-gray-500 md:w-80 w-calc[100%-2rem]" type="text" placeholder="Enter your full name" name="full_name" style="background-color: #F1EBFF;" aria-label="input full name" required>
                </div>

                <div class="flex flex-col">
                  <label class = "pb-1"> Username</label>
                  <input class=" rounded-md p-3 text-gray-500 md:w-80 w-calc[100%]" type = 'text' fpr = 'username' placeholder="Choose a username" name="username" style="background-color: #F1EBFF;" aria-label="input username" required>
                </div>
                
                <div class="flex flex-col">
                  <label class = "pb-1">Phone Number</label>
                  <input id = 'phoneNumber' class=" appearance-none rounded-md p-3 text-gray-500 md:w-80 w-calc[100%]" type = 'number' placeholder="Enter your phone number" name = phone_number style="background-color: #F1EBFF;" aria-label="input phone number"  required>
                  <style>
                    /* Custom css to remove the increase and decrease arrows from the above "number" type input*/
                    input::-webkit-outer-spin-button,
                    input::-webkit-inner-spin-button {
                        -webkit-appearance: none;
                        margin: 0;
                    }
                  
                    input[type="number"] {
                        -moz-appearance: textfield;
                    }
                  </style>
                </div>

                <div class="flex flex-col">
                  <label id = 'emailInput' class = "pb-1">Email Address</label>
                  <input class=" rounded-md p-3 text-gray-500 md:w-80 w-calc[100%]" type = 'email' placeholder="Enter your email address" name = "email" style="background-color: #F1EBFF;" aria-label="input email address" required>
                </div>
              </div>

              <div class = "md:w-1/2 flex flex-col justify-center gap-4">
                <h2 class = "font-bold pt-5 pb-1">Account Type</h2>

                <div class="flex flex-row gap-4">
                  <label class = "border border-gray-300 rounded-md flex items-center  cursor-pointer "  >
                    <input class = 'hidden peer' type ='radio'name = "Account_type" value="Shopper" aria-label="select shopper account type" >
                    <span class=" rounded p-3 peer-checked:bg-primary border-primary peer-checked:text-white hover:md:bg-primary hover:md:text-white"> Shopper </span>
                  </label>
                  <label class = "border border-gray-300 rounded-md flex items-center  cursor-pointer "  >
                    <input class = 'hidden peer' type ='radio'name = "Account_type" value="Merchant" aria-label="select merchant account type">
                    <span class=" rounded p-3 peer-checked:bg-primary border-primary peer-checked:text-white hover:md:bg-primary hover:md:text-white"> Merchant </span>
                  </label>
                </div>

                <div class="flex flex-col">
                  <label class = "pb-1">Create Password</label>
                  <input id = 'digits' class = "rounded-md p-3 text-gray-500 md:w-80 w-calc[100%] "  type = 'password' placeholder="Create a Password" name = 'password' style="background-color: #F1EBFF;" aria-label="input password" required>
                </div>

                <div class="flex flex-col">
                  <label class = "pb-1">Confirm Password</label>
                  <input id = 'confirmDigits' class = "rounded-md p-3 text-gray-500 md:w-80 w-calc[100%]" type = 'password' placeholder="Confirm your password" name = 'confirm_Password' style="background-color: #F1EBFF;"aria-label="confirm password" required>
                </div>
              </div>
            </div>
          </div>
          <div class=" flex flex-row justify-center py-9">
           <button class="button bg-primary md:bg-[#7C53E7] border rounded-full text-white py-3 md:w-80 w-full cursor-pointer hover:md:bg-primary" type="submit" type="submit" aria-label="submit form"> Sign Up</button>
          </div>
        </form>
      </div>
    </main>
    <script src = "./scripts/singup.js"></script>

  </body>
</html>
