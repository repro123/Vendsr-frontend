<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup Your Vendsr Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/output.css" />
  </head>

  <body
    class="min-h-dvh antialiased bg-bodyBackground text-paragraphColor font-inter"
    data-page="Store-setup"
  >
    <header class="bg-white sticky top-0 z-50 px-4 py-3 hidden md:block">
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <a href="../" aria-label="Vendsr Home Page">
          <img src="../assets/icons/vendsr-logo.png" alt="Vendsr Logo" />
        </a>
      </div>
    </header>

    <main
      class="min-h-screen md:min-h-[calc(100vh-3.5rem)] sm:grid sm:place-items-center sm:p-4"
    >
      <div
        class="w-full mx-auto flex flex-col gap-6 h-full bg-white p-4 sm:h-auto sm:max-w-5xl sm:p-8 sm:rounded-2xl md:px-8"
      >
        <header class="text-center py-4 relative">
          <h1 class="font-semibold text-xl">Let's set up your store</h1>
          <a
            href="../"
            aria-label="Back to previous page"
            class="absolute left-0 top-1/2 -translate-y-1/2"
            ><img src="../assets/icons/arrow-back.png" alt=""
          /></a>
        </header>

        <section>
          <form
            id="storeSetupForm"
            enctype="multipart/form-data"
            class="flex flex-col gap-6"
            novalidate
          >
            <div class="grid gap-6 md:grid-cols-2 md:gap-16">
              <div class="flex flex-col gap-6">
                <div class="flex flex-col md:order-3">
                  <div class="flex gap-4 items-center text-center">
                    <label class="form-input cursor-pointer">
                      <input
                        type="file"
                        name="storeLogo"
                        id="storeLogo"
                        required
                        class="hidden"
                        accept="image/jpeg, image/png"
                      />
                      <span class="font-bold">Upload Logo</span>
                    </label>

                    <label class="form-input cursor-pointer">
                      <input
                        type="file"
                        name="coverImage"
                        id="coverImage"
                        required
                        accept="image/jpeg, image/png"
                        class="hidden"
                      />
                      <span class="font-bold">Upload Cover</span>
                    </label>
                  </div>
                  <span
                    aria-label="jpeg and png formats accepted"
                    class="text-center"
                    >(jpeg, png)</span
                  >
                  <p
                    id="imagesError"
                    class="text-red-500"
                    aria-live="polite"
                  ></p>
                </div>

                <div class="flex flex-col">
                  <label for="storeName">Store Name</label>
                  <input
                    type="text"
                    name="storeName"
                    id="storeName"
                    required
                    placeholder="Enter your store name"
                    class="form-input"
                  />
                  <p
                    class="text-red-500"
                    aria-live="polite"
                    id="storeNameError"
                  ></p>
                </div>

                <div class="flex flex-col">
                  <label for="storeDescription">Store Description</label>
                  <textarea
                    name="storeDescription"
                    id="storeDescription"
                    class="resize-y form-input"
                    placeholder="Description"
                    required
                  ></textarea>
                  <p
                    class="text-red-500"
                    aria-live="polite"
                    id="storeDescriptionError"
                  ></p>
                </div>
              </div>

              <div class="flex flex-col gap-6">
                <div class="flex flex-col">
                  <label for="storeProduct">What do you sell?</label>
                  <input
                    type="text"
                    name="storeProduct"
                    id="storeProduct"
                    required
                    placeholder="e.g bag, snacks, tech"
                    class="form-input"
                  />
                  <p
                    class="text-red-500"
                    aria-live="polite"
                    id="storeProductError"
                  ></p>
                </div>

                <div class="flex flex-col">
                  <label for="storeLocation">Business Location</label>
                  <input
                    type="text"
                    name="storeLocation"
                    id="storeLocation"
                    required
                    placeholder="City/State"
                    class="form-input"
                  />
                  <p
                    class="text-red-500"
                    aria-live="polite"
                    id="storeLocationError"
                  ></p>
                </div>

                <div class="flex flex-col">
                  <label for="storeWhatsappNumber">Whatsapp Number</label>
                  <input
                    type="text"
                    name="storeWhatsappNumber"
                    id="storeWhatsappNumber"
                    required
                    placeholder="Your active whatsapp number"
                    class="form-input"
                  />
                  <p
                    class="text-red-500"
                    aria-live="polite"
                    id="storeWhatsappNumberError"
                  ></p>
                </div>
              </div>
            </div>
            <button
              type="submit"
              class="bg-primary text-white py-3 rounded-full w-full text-center mt-6 block cursor-pointer hover:bg-primary/80 md:w-fit mx-auto md:px-36 whitespace-nowrap"
            >
              Create my store
            </button>
          </form>
        </section>
      </div>
    </main>

    <script src="../scripts/storesetup.js"></script>
  </body>
</html>
