<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendsr Sign Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link href="src/output.css" rel="stylesheet">
</head>
<body class="min-h-dvh antialiased bg-bodyBackground text-paragraphColor font-inter">
    <header class=" hidden md:block bg-white sticky top-0 z-50 px-4 py-3">
        
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <a href="#" aria-label="Vendsr Home Page">
          <img src="./assets/icons/vendsr-logo.png" alt="Vendsr Logo" />
        </a>
    </header>
    <div class="flex justify-center items-center h-screen">
        <div class="w-96 p-6 shadow-lg bg-white rounded-2xl">
            <div class=" flex gap-30">
                <img src="./assets/icons/arrow-back.png" alt="">
                <h1 class="font-bold font-inter text-paragraphColor">Sign in</h1>
            </div>
            
            <div class="mt-8">
                <label for="PhoneNo_Email" class="block text-base mb-2">Phone Number or Email</label>
                <input type="text" id="PhoneNo_Email" class=" w-xs h-14 rounded-lg p-2 bg-purple-100" placeholder="Enter your Phone Number or email">
            </div>
            <div class="mt-8">
                <label for="password" class="block text-base mb-2">Password</label>
                <input type="text" id="password" class=" w-xs h-14 rounded-lg p-2 bg-purple-100" placeholder="Enter your Password">

            </div>
            <div>
                <a href="#" class="text-xs block mt-3 font-inter font-thin">Forgot Password?</a>
            </div>
        
            <a href="#">
                <button class="bg-primary mt-10 mb-2 border rounded-full w-xs h-14 text-white">Sign in</button>
            </a>
        </div>
    </div>
    <script></script>
</body>
</html>
