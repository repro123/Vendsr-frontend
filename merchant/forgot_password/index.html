<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link href="../../src/output.css" rel="stylesheet" />
  </head>
  <body
    class="min-h-dvh antialiased bg-bodyBackground text-paragraphColor font-inter"
    data-page="resetPassword"
  >
    <header class="bg-white sticky top-0 z-50 px-4 py-3 hidden md:block">
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <a href="/" aria-label="Vendsr Home Page">
          <img src="../../assets/icons/vendsr-logo.png" alt="Vendsr Logo" />
        </a>
      </div>
    </header>

    <main
      class="min-h-screen md:min-h-[calc(100vh-3.5rem)] sm:grid sm:place-items-center sm:p-4 max-md:bg-white"
    >
      <div
        class="w-full mx-auto flex flex-col gap-6 h-full bg-white p-4 sm:h-auto sm:max-w-xl sm:p-8 sm:rounded-2xl md:px-8"
      >
        <header class="text-center py-4 relative">
          <h1 class="font-semibold text-xl">Create New Password</h1>
          <a
            href="../"
            aria-label="Back to previous page"
            class="absolute left-0 top-1/2 -translate-y-1/2"
            ><img src="../../assets/icons/arrow-back.png" alt=""
          /></a>
        </header>

        <section>
          <form id="resetPassword" class="flex flex-col gap-8" novalidate>
            <div class="flex flex-col gap-6">
              <div class="flex flex-col gap-2">
                <label for="password" class="font-semibold">Password</label>
                <div class="relative">
                  <input
                    type="password"
                    id="password"
                    required
                    name="password"
                    placeholder="Enter your password"
                    class="form-input pl-10"
                  />
                  <img
                    src="../../assets/icons/padlock.png"
                    alt=""
                    class="absolute left-3 top-1/2 -translate-y-1/2"
                  />
                  <button
                    type="button"
                    aria-label="Toggle password visibility"
                    class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer flex items-center justify-center group"
                    data-state="hidden"
                  >
                    <img
                      src="../../assets/icons/passwordeye.png"
                      alt="Show password"
                      class="group-data-[state='visible']:rotate-180 duration-300"
                    />
                  </button>
                </div>

                <ul id="passwordRules" class="space-y-2 text-sm pl-4">
                  <li data-rule="length" class="flex items-center gap-2">
                    <span class="icon">❌</span> At least 8 characters
                  </li>
                  <li data-rule="uppercase" class="flex items-center gap-2">
                    <span class="icon">❌</span> One uppercase letter
                  </li>
                  <li data-rule="lowercase" class="flex items-center gap-2">
                    <span class="icon">❌</span> One lowercase letter
                  </li>
                  <li data-rule="number" class="flex items-center gap-2">
                    <span class="icon">❌</span> One number
                  </li>
                  <li data-rule="special" class="flex items-center gap-2">
                    <span class="icon">❌</span> One special character (!@#$...)
                  </li>
                </ul>
              </div>

              <div class="flex flex-col gap-2">
                <label for="confirmPassword" class="font-semibold"
                  >Confirm Password</label
                >
                <div class="relative">
                  <input
                    type="password"
                    id="confirmPassword"
                    required
                    name="confirmPassword"
                    placeholder="Enter your password"
                    class="form-input pl-10"
                  />
                  <img
                    src="../../assets/icons/padlock.png"
                    alt=""
                    class="absolute left-3 top-1/2 -translate-y-1/2"
                  />
                  <button
                    type="button"
                    aria-label="Toggle password visibility"
                    class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer flex items-center justify-center group"
                    data-state="hidden"
                  >
                    <img
                      src="../../assets/icons/passwordeye.png"
                      alt="Show password"
                      class="group-data-[state='visible']:rotate-180 duration-300"
                    />
                  </button>
                </div>
                <span
                  class="text-red-500"
                  id="confirmPasswordError"
                  aria-live="polite"
                ></span>
              </div>
            </div>

            <button
              type="submit"
              disabled
              class="rounded-full bg-[#757575] text-white tracking-wider font-semibold cursor-pointer w-full py-3"
            >
              Reset Password
            </button>
          </form>
        </section>
      </div>
    </main>

    <script src="../../scripts/resetPassword.js"></script>
  </body>
</html>
