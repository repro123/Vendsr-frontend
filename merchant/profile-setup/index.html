<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Setup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../../src/output.css" />
  </head>
  <body
    class="min-h-dvh antialiased bg-bodyBackground text-paragraphColor font-inter"
    data-page="profile-setup"
  >
    <header class="bg-white sticky top-0 z-50 px-4 py-3 hidden md:block">
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <a href="../" aria-label="Vendsr Home Page">
          <img src="../../assets/icons/vendsr-logo.png" alt="Vendsr Logo" />
        </a>
      </div>
    </header>

    <main
      class="min-h-screen md:min-h-[calc(100vh-3.5rem)] sm:grid sm:place-items-center sm:p-4"
    >
      <div
        class="w-full mx-auto flex flex-col gap-6 min-h-screen bg-white sm:h-auto sm:max-w-5xl sm:p-8 sm:rounded-2xl md:px-8"
      >
        <form
          method="post"
          novalidate
          id="profileSetup"
          enctype="multipart/form-data"
        >
          <div
            class="relative h-[200px] md:h-[300px] bg-cover bg-center rounded-lg"
          >
            <label
              for="coverPhoto"
              class="cursor-pointer flex flex-col items-center justify-center gap-2 w-full h-full bg-inputBackground rounded-lg p-4 text-center text-gray-500"
            >
              <input
                type="file"
                id="coverPhoto"
                name="cover_photo"
                accept="image/*"
                class="hidden"
                aria-label="Upload cover photo"
              />
              <img
                src="../../assets/icons/upload-photo.png"
                alt="Upload cover photo"
                class="w-12 h-12"
              />
              <span class="capitalize">upload cover image</span>
            </label>

            <label
              for="profilePicture"
              class="cursor-pointer flex flex-col items-center justify-center gap-2 bg-btnText rounded-full p-2 w-28 h-28 md:w-40 md:h-40 border-4 border-white absolute left-0 -bottom-1/2 -translate-y-1/2"
            >
              <input
                type="file"
                id="profilePicture"
                name="profile_picture"
                accept="image/*"
                class="hidden"
                aria-label="Upload profile picture"
              />
              <img
                src="../../assets/icons/upload-photo.png"
                alt="Upload profile picture"
                class="w-6 h-6"
              />
              <span class="capitalize text-xs md:text-sm text-center"
                >upload profile image</span
              >
            </label>
          </div>

          <div class="mt-20 md:mt-24 flex flex-col space-y-6 max-sm:px-6">
            <div class="grid gap-2">
              <label for="storeName">Store Name</label>
              <input
                type="text"
                id="storeName"
                name="store_name"
                required
                placeholder="Enter your store name"
                class="form-input"
                data-invalid="false"
              />
              <p
                class="text-red-500"
                aria-live="polite"
                id="storeNameError"
              ></p>
            </div>

            <div class="grid gap-2">
              <label for="username">Username</label>
              <input
                type="text"
                id="username"
                name="username"
                required
                placeholder="Enter your username"
                class="form-input"
                data-invalid="false"
              />
              <p class="text-red-500" aria-live="polite" id="usernameError"></p>
            </div>

            <div class="grid gap-2">
              <label for="category">Category</label>
              <div class="relative">
                <select
                  name="category"
                  id="category"
                  class="form-input no-arrow text-primary"
                  required
                  data-invalid="false"
                >
                  <option value="" disabled selected>Select category</option>
                  <option value="apparel">Apparel & Accessories</option>
                  <option value="groceries">Groceries</option>
                  <option value="electronics">Electronics</option>
                  <option value="beauty">Beauty and personal care</option>
                  <option value="homegoods">Home goods</option>
                  <option value="others">Others</option>
                </select>
                <img
                  src="../../assets/icons/arrow-down.png"
                  alt="Dropdown arrow"
                  class="absolute right-4 top-1/2 transform -translate-y-1/2 w-4 h-4 pointer-events-none"
                />
              </div>
              <p class="text-red-500" aria-live="polite" id="categoryError"></p>
            </div>

            <div class="grid gap-2">
              <label for="description">Description</label>
              <textarea
                id="description"
                name="description"
                placeholder="Enter a brief description of your store"
                class="form-input h-32 resize-none"
                data-invalid="false"
              ></textarea>
              <p
                class="text-red-500"
                aria-live="polite"
                id="descriptionError"
              ></p>
            </div>

            <div class="grid gap-2">
              <p>Set store colors</p>
              <button
                class="form-input active:border-primary cursor-pointer h-12 relative"
                type="button"
                id="colorPicker"
                aria-label="Select store color"
                data-color-picker="true"
                data-invalid="false"
              >
                <img
                  src="../../assets/icons/eyedropper.png"
                  alt=""
                  class="absolute right-4 top-1/2 transform -translate-y-1/2 w-4 h-4 pointer-events-none"
                />
              </button>

              <div
                class="flex items-center form-input h-12 p-1 gap-2 overflow-x-auto"
              >
                <label
                  for="red"
                  class="bg-[#FF0000] rounded-md h-full w-full cursor-pointer"
                >
                  <input
                    type="radio"
                    name="storeColor"
                    id="red"
                    value="#FF0000"
                    class="hidden"
                    required
                    data-invalid="false"
                  />
                </label>

                <label
                  for="yellow"
                  class="bg-[#FFFC9E] rounded-md h-full w-full cursor-pointer"
                >
                  <input
                    type="radio"
                    name="storeColor"
                    id="yellow"
                    value="#FFFC9E"
                    class="hidden"
                    required
                    data-invalid="false"
                  />
                </label>

                <label
                  for="blue"
                  class="bg-[#2F4AFF] rounded-md h-full w-full cursor-pointer"
                >
                  <input
                    type="radio"
                    name="storeColor"
                    id="blue"
                    value="#2F4AFF"
                    class="hidden"
                    required
                    data-invalid="false"
                  />
                </label>

                <label
                  for="pink"
                  class="bg-[#F052BC] rounded-md h-full w-full cursor-pointer"
                >
                  <input
                    type="radio"
                    name="storeColor"
                    id="pink"
                    value="#F052BC"
                    class="hidden"
                    required
                    data-invalid="false"
                  />
                </label>

                <label
                  for="green"
                  class="bg-[#00BA86] rounded-md h-full w-full cursor-pointer"
                >
                  <input
                    type="radio"
                    name="storeColor"
                    id="green"
                    value="#00BA86"
                    class="hidden"
                    required
                    data-invalid="false"
                  />
                </label>

                <label
                  for="black"
                  class="bg-[#040000] rounded-md h-full w-full cursor-pointer"
                >
                  <input
                    type="radio"
                    name="storeColor"
                    id="black"
                    value="#040000"
                    class="hidden"
                    required
                    data-invalid="false"
                  />
                </label>

                <label
                  for="white"
                  class="bg-[#FFFFFF] rounded-md h-full w-full cursor-pointer"
                >
                  <input
                    type="radio"
                    name="storeColor"
                    id="white"
                    value="#FFFFFF"
                    class="hidden"
                    required
                    data-invalid="false"
                  />
                </label>

                <label
                  for="brown"
                  class="bg-[#A87878] rounded-md h-full w-full cursor-pointer"
                >
                  <input
                    type="radio"
                    name="storeColor"
                    id="brown"
                    value="#A87878"
                    class="hidden"
                    required
                    data-invalid="false"
                  />
                </label>
              </div>
              <p
                class="text-red-500"
                aria-live="polite"
                id="storeColorError"
              ></p>
            </div>

            <div class="grid gap-2">
              <label for="storeUrl">Store URL</label>
              <input
                type="text"
                id="storeUrl"
                name="store_url"
                required
                placeholder="Enter your store URL - e.g., mystore.vendsr.com"
                class="form-input"
                data-invalid="false"
              />
              <p class="text-red-500" aria-live="polite" id="storeUrlError"></p>
            </div>

            <button
              type="submit"
              disabled
              class="bg-disabledBtn text-white py-3 rounded-full w-full text-center mt-6 block md:w-fit mx-auto md:px-36 whitespace-nowrap cursor-not-allowed"
            >
              Create Store
            </button>
          </div>
        </form>
      </div>

      <dialog
        id="createStoreConfirmation"
        class="m-auto rounded-2xl border-2 border-primary w-full max-w-80 md:max-w-96 [&::backdrop]:backdrop-blur-sm [&::backdrop]:bg-primary/10"
      >
        <div
          class="flex flex-col items-center gap-4 p-12 text-center w-full h-full"
        >
          <img
            src="../../assets/icons/completed.png"
            alt=""
            class="mx-auto w-12 h-12"
          />
          <p>Your store is ready!</p>
          <p>You have successfully created your merchant account</p>

          <button
            id="goToStore"
            class="bg-primary text-white py-3 rounded-full w-full text-center mt-16 block whitespace-nowrap cursor-pointer"
          >
            Go To Store
          </button>
          <a href="#">Go back</a>
        </div>
      </dialog>
    </main>

    <script src="../../scripts/profile_setup.js"></script>
  </body>
</html>
