<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a Vendsr Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../src/output.css" />
  </head>

  <body
    class="min-h-dvh antialiased bg-bodyBackground text-paragraphColor font-inter"
    data-page="Sign-up"
  >
    <header class="bg-white sticky top-0 z-50 px-4 py-3 hidden md:block">
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <a href="../" aria-label="Vendsr Home Page">
          <img src="../../assets/icons/vendsr-logo.png" alt="Vendsr Logo" />
        </a>
      </div>
    </header>

    <main
      class="min-h-screen md:min-h-[calc(100vh-3.5rem)] sm:grid sm:place-items-center sm:p-4"
    >
      <div
        class="w-full mx-auto flex flex-col gap-6 min-h-screen bg-white p-4 sm:h-auto sm:max-w-5xl sm:p-8 sm:rounded-2xl md:px-8"
      >
        <header class="text-center py-4 relative">
          <h1 class="font-semibold text-xl">Create an Account</h1>
          <a
            href="../"
            aria-label="Back to previous page"
            class="absolute left-0 top-1/2 -translate-y-1/2"
            ><img src="../../assets/icons/arrow-back.png" alt=""
          /></a>
        </header>

        <section>
          <form id="signup" method="post" novalidate>
            <div class="grid gap-6 md:grid-cols-2 md:gap-16">
              <div class="flex flex-col gap-6">
                <div>
                  <label for="fullName">Full Name *</label>
                  <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    autocomplete="name"
                    placeholder="Enter your full name"
                    required
                    class="form-input"
                    data-invalid="false"
                  />
                  <p
                    id="fullNameError"
                    class="text-red-500"
                    aria-live="polite"
                  ></p>
                </div>

                <div>
                  <label for="username">Username *</label>
                  <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="choose a username"
                    required
                    class="form-input"
                    data-invalid="false"
                  />
                  <p
                    id="usernameError"
                    class="text-red-500"
                    aria-live="polite"
                  ></p>
                </div>

                <div>
                  <label for="phoneNumber">Phone Number *</label>
                  <input
                    type="text"
                    id="phoneNumber"
                    name="phoneNumber"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    required
                    class="form-input"
                    data-invalid="false"
                  />
                  <p
                    id="phoneNumberError"
                    class="text-red-500"
                    aria-live="polite"
                  ></p>
                </div>

                <div>
                  <label for="email">Email Address *</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                    class="form-input"
                    data-invalid="false"
                  />
                  <p
                    id="emailError"
                    class="text-red-500"
                    aria-live="polite"
                  ></p>
                </div>
              </div>

              <div class="flex flex-col gap-6">
                <div class="flex flex-col gap-2">
                  <label for="password" class="font-semibold"
                    >Create Password</label
                  >
                  <div class="relative">
                    <input
                      type="password"
                      id="password"
                      required
                      name="password"
                      placeholder="Enter your password"
                      class="form-input pl-10"
                    />
                    <img
                      src="../../assets/icons/padlock.png"
                      alt=""
                      class="absolute left-3 top-1/2 -translate-y-1/2"
                    />
                    <button
                      type="button"
                      aria-label="Toggle password visibility"
                      class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer flex items-center justify-center group"
                      data-state="hidden"
                    >
                      <img
                        src="../../assets/icons/passwordeye.png"
                        alt="Show password"
                        class="group-data-[state='visible']:rotate-180 duration-300"
                      />
                    </button>
                  </div>

                  <p
                    class="text-red-500"
                    id="passwordError"
                    aria-live="polite"
                  ></p>
                </div>

                <div class="flex flex-col gap-2">
                  <label for="confirmPassword" class="font-semibold"
                    >Confirm Password</label
                  >
                  <div class="relative">
                    <input
                      type="password"
                      id="confirmPassword"
                      required
                      name="confirmPassword"
                      placeholder="Enter your password"
                      class="form-input pl-10"
                    />
                    <img
                      src="../../assets/icons/padlock.png"
                      alt=""
                      class="absolute left-3 top-1/2 -translate-y-1/2"
                    />
                    <button
                      type="button"
                      aria-label="Toggle password visibility"
                      class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer flex items-center justify-center group"
                      data-state="hidden"
                    >
                      <img
                        src="../../assets/icons/passwordeye.png"
                        alt="Show password"
                        class="group-data-[state='visible']:rotate-180 duration-300"
                      />
                    </button>
                  </div>
                  <span
                    class="text-red-500"
                    id="confirmPasswordError"
                    aria-live="polite"
                  ></span>
                </div>
              </div>
            </div>

            <button
              type="submit"
              disabled
              class="bg-disabledBtn text-white py-3 rounded-full w-full text-center mt-6 block md:w-fit mx-auto md:px-36 whitespace-nowrap cursor-not-allowed"
            >
              Sign Up
            </button>
          </form>
          <p class="mt-6 text-center">
            Already have an account?
            <a
              href="../login/"
              class="text-primary underline hover:no-underline"
              >Sign in</a
            >
          </p>
        </section>
      </div>
    </main>

    <script src="../../scripts/signup.js"></script>
  </body>
</html>
