<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Verification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="../../src/output.css" />
  </head>
  <body
    class="min-h-dvh antialiased bg-bodyBackground text-paragraphColor font-inter"
    data-page="business-verification"
  >
    <header class="bg-white sticky top-0 z-50 px-4 py-3 hidden md:block">
      <div class="flex items-center justify-between max-w-7xl mx-auto">
        <a href="../" aria-label="Vendsr Home Page">
          <img src="../../assets/icons/vendsr-logo.png" alt="Vendsr Logo" />
        </a>
      </div>
    </header>

    <main
      class="min-h-screen md:min-h-[calc(100vh-3.5rem)] sm:grid sm:place-items-center sm:p-4"
    >
      <div
        class="w-full mx-auto flex flex-col gap-6 min-h-screen bg-white p-4 sm:h-auto sm:max-w-5xl sm:p-8 sm:rounded-2xl md:px-8"
      >
        <header class="text-center py-4 relative">
          <h1 class="font-semibold text-xl">Business Verification (CAC)</h1>
          <a
            href="#"
            aria-label="Back to previous page"
            class="absolute left-0 top-1/2 -translate-y-1/2"
            ><img src="../../assets/icons/arrow-back.png" alt=""
          /></a>
        </header>

        <section>
          <p class="capitalize text-center">
            verify your business to build trust
          </p>

          <form
            id="cacVerificationForm"
            enctype="multipart/form-data"
            class="flex flex-col gap-6 mt-6"
            novalidate
          >
            <div class="grid gap-6 md:grid-cols-2 md:gap-16">
              <div class="flex flex-col gap-6">
                <div class="flex flex-col">
                  <label for="CAC_Number">CAC Number</label>
                  <input
                    type="text"
                    name="CAC_Number"
                    id="CAC_Number"
                    required
                    placeholder="Enter your CAC Number"
                    class="form-input"
                  />
                  <p
                    class="text-red-500"
                    aria-live="polite"
                    id="CAC_NumberError"
                  ></p>
                </div>

                <div class="flex flex-col">
                  <label for="businessName">Business Name</label>
                  <input
                    type="text"
                    name="businessName"
                    id="businessName"
                    required
                    placeholder="Enter your business name"
                    class="form-input"
                  />
                  <p
                    class="text-red-500"
                    aria-live="polite"
                    id="businessNameError"
                  ></p>
                </div>

                <div class="flex flex-col">
                  <label for="businessOwnerName">Business Owner Name</label>
                  <input
                    type="text"
                    name="businessOwnerName"
                    id="businessOwnerName"
                    required
                    placeholder="Enter your business owner name"
                    class="form-input"
                  />
                  <p
                    class="text-red-500"
                    aria-live="polite"
                    id="businessOwnerNameError"
                  ></p>
                </div>
              </div>

              <div
                class="grid place-items-center border border-dashed rounded-xl p-12"
              >
                <div class="text-center flex flex-col items-center gap-2">
                  <p class="font-semibold text-xl">Upload CAC Certificate</p>
                  <p>PDF or photo</p>
                  <label class="mt-2 cursor-pointer">
                    <span
                      aria-hidden="true"
                      class="bg-inputBackground font-black px-8 py-2 rounded-full"
                      >+</span
                    >
                    <span class="sr-only"
                      >Upload PDF or photo of CAC Certificate</span
                    >
                    <input
                      type="file"
                      accept="application/pdf,image/*"
                      required
                      id="cacCertificate"
                      name="cac certificate"
                      class="hidden"
                    />
                  </label>
                </div>
              </div>
            </div>

            <div
              class="flex flex-col gap-6 md:flex-row w-full items-center mt-6"
            >
              <button
                type="submit"
                disabled
                class="bg-disabledBtn text-white py-3 rounded-full w-full text-center block cursor-pointer whitespace-nowrap"
              >
                Submit
              </button>

              <a
                href="../profile-setup/"
                class="w-full border border-primary text-primary py-3 rounded-full text-center hover:bg-primary/10"
              >
                Skip
              </a>
            </div>
          </form>
        </section>
      </div>
    </main>

    <script src="../../scripts/merchantBusiness_verification.js"></script>
  </body>
</html>
